name: Render manuscript

on:
  # Run on demand (when we know we're making edits, e.g. preparing the next
  # preprint version) and on pushes to main. No schedule — we don't need
  # frequent rebuilds; trigger a run when the Doc or data has changed.
  workflow_dispatch:
  push:
    branches: [main]

# Allow the workflow to deploy to GitHub Pages and to commit the rebuilt PDF
# snapshot back to the repo (contents: write).
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch manuscript prose from Google Doc
        # Non-fatal: if the Doc is not link-viewable yet, keep the committed
        # _prose.md snapshot so the build still succeeds.
        run: |
          python scripts/fetch_prose.py || \
            echo "Doc fetch failed; using committed _prose.md snapshot."

      - name: Build figures
        working-directory: analysis
        run: |
          uv sync
          uv run python make_figures_1_2_detections.py
          uv run python make_figure_3_sequencing.py
          uv run python make_supplement_1_wastewater.py
          # Cream-background Figure 4 for the HTML site. The white Illustrator
          # export is what the submission PDF uses.
          uv run --with pillow python central_figure/recolor_background.py

      - name: Collect journal submission figures
        # Gathers each figure as a separate, journal-named file in
        # submission/figures/, preferring vector PDF. Warns (without failing)
        # when a figure is raster-only, which currently applies to Figure 4
        # because its Illustrator master lives in Google Drive, not this repo.
        run: python scripts/build_submission_figures.py

      - name: Install house fonts (open, metric-compatible clones)
        # The house faces are Georgia + Arial (proprietary). We use the open,
        # metric-compatible clones Gelasio (= Georgia) and Arimo (= Arial) so the
        # PDF builds reproducibly. Arimo ships in fonts-croscore (body font);
        # Gelasio's display statics are built from the upstream variable font by
        # scripts/build_house_fonts.py into ./fonts, which house-preamble.tex
        # references by path.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-croscore
          uv run --with fonttools python scripts/build_house_fonts.py
          fc-cache -f >/dev/null
          echo "Body clone (Arimo):"; fc-list | grep -i arimo | sort -u
          echo "Display clone (Gelasio, ./fonts):"; ls -1 fonts/*.ttf

      - name: Install tectonic (PDF engine)
        # _quarto.yml sets pdf-engine: tectonic; install it so the runner has it.
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML site
        run: quarto render --to html

      - name: Render submission PDFs (journal + preprint)
        # Two PDFs from one source, differing only in the preprint pointer:
        #   team-canada-air-sampling.pdf          -> Eurosurveillance submission
        #   team-canada-air-sampling-preprint.pdf -> medRxiv preprint
        # tectonic fetches LaTeX packages on demand, which occasionally hits a
        # transient network failure (e.g. fontspec.sty). Retry a few times;
        # successfully-fetched packages are cached, so a retry finishes the rest.
        run: |
          render_pdf () {   # $1 = human label, $2… = extra quarto args
            local label="$1"; shift
            for attempt in 1 2 3; do
              if quarto render index.qmd --to pdf "$@"; then return 0; fi
              echo "$label PDF attempt $attempt failed; retrying…"; sleep 10
            done
            echo "$label PDF failed after 3 attempts"; exit 1
          }

          # Journal submission: no preprint pointer.
          render_pdf "Journal"
          cp _site/index.pdf _site/team-canada-air-sampling.pdf

          # Preprint: same build with the "Preprint only" note under the title.
          render_pdf "Preprint" -M preprint:true
          cp _site/index.pdf _site/team-canada-air-sampling-preprint.pdf

          # Leave _site/index.pdf as the journal build, so the in-page PDF link
          # and the committed snapshot both point at the submission version.
          cp _site/team-canada-air-sampling.pdf _site/index.pdf

          # Publish into docs/ here, not in the commit step further down: the
          # packaging step below copies the manuscript PDFs out of docs/, so if
          # that copy happens after packaging it stages the PREVIOUS run's PDFs
          # and the medRxiv package silently ships stale text.
          cp _site/team-canada-air-sampling.pdf docs/team-canada-air-sampling.pdf
          cp _site/team-canada-air-sampling-preprint.pdf \
             docs/team-canada-air-sampling-preprint.pdf

      - name: Build the Eurosurveillance Word files
        # Eurosurveillance reviews anonymised manuscripts and cannot evaluate a
        # PDF of the text, so the submission goes as .docx: a title page, an
        # anonymised manuscript with line numbers, and their PH-message file.
        run: uv run --with python-docx python scripts/build_eurosurveillance_docx.py

      - name: Stage the submission packages
        # Assembles submission/eurosurveillance/ and submission/medrxiv/ from
        # the PDFs rendered above plus submission/figures/. The cover letter is
        # authored in the manuscript's Google Drive folder and is not available
        # on the runner, so its absence is expected here and the step is not
        # allowed to fail the build; run the script locally to get the complete
        # Eurosurveillance package.
        continue-on-error: true
        run: python scripts/build_submission_package.py

      - name: Commit Doc-synced content and rebuilt PDF
        # Each run pulls the latest Google Doc, so commit the synced prose,
        # legends, front matter, regenerated figures, and the rebuilt
        # submission PDF back to the repo. This keeps the repo a faithful snapshot
        # of what CI built and submitted. [skip ci] avoids retriggering.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Track only the source-of-record outputs (fonts/, _site/ stay ignored).
          git add -A -- _title.yml _prose.md _frontmatter.md _references.md \
            _supplement.md _legends \
            analysis/figures/figure1_detections_static.png \
            analysis/figures/figure2_houston.png \
            analysis/figures/supplement1_wastewater.png \
            analysis/figures/figure3_sequencing.png \
            analysis/figures/figure3_sequencing_transparent.png \
            analysis/central_figure/central_figure_cream.png \
            analysis/central_figure/central_figure.pdf \
            analysis/figures/figure1_detections_static.pdf \
            analysis/figures/figure2_houston.pdf \
            analysis/figures/figure3_sequencing.pdf \
            analysis/figures/supplement1_wastewater.pdf \
            submission \
            analysis/data docs/team-canada-air-sampling.pdf \
            docs/team-canada-air-sampling-preprint.pdf
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "CI: sync Google Doc content and rebuild outputs [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: |
            _site/team-canada-air-sampling.pdf
            _site/team-canada-air-sampling-preprint.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
