<script>
// Quarto emits each figure caption as a bare "Figure 1: " text node followed by
// the bold title. CSS cannot target a bare text node, so wrap the number in a
// span that theme-house.scss can style — this is what gives the online figure
// numbers the same terracotta accent they have in the submission PDF.
document.addEventListener("DOMContentLoaded", function () {
  var sel = "#fig-detections figcaption, #fig-houston figcaption, " +
            "#fig-sequencing figcaption";
  Array.prototype.forEach.call(document.querySelectorAll(sel), function (cap) {
    var node = cap.firstChild;
    // Skip any whitespace-only node Quarto emits before the label.
    while (node && node.nodeType === 3 && !node.nodeValue.trim()) {
      node = node.nextSibling;
    }
    if (!node || node.nodeType !== 3) return;
    // Quarto separates the word and the number with a non-breaking space.
    var m = node.nodeValue.match(/^(\s*Figure[\s ]+\d+[:.]?)([\s\S]*)$/);
    if (!m) return;
    var span = document.createElement("span");
    span.className = "fig-number";
    span.textContent = m[1];
    node.nodeValue = m[2];
    cap.insertBefore(span, node);
  });
});

// Open every outbound link in a new tab, so following a DOI or a dashboard does
// not navigate the reader away from the manuscript. Quarto's
// link-external-newwindow does not reach links that arrive through
// {{< include >}} partials (the citation links, the reference list, the
// data-and-code links all do), so apply it here across the whole page.
// rel="noopener" is required with target=_blank: without it the opened page can
// reach back through window.opener.
document.addEventListener("DOMContentLoaded", function () {
  var here = window.location.hostname;
  Array.prototype.forEach.call(document.querySelectorAll("a[href]"), function (a) {
    var href = a.getAttribute("href") || "";
    if (!/^https?:\/\//i.test(href)) return;            // in-page or relative
    if (a.hostname === here) return;                     // same site
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
  });
});
</script>
