[project]
name = "team-canada-airviz"
version = "0.1.0"
description = "Interactive and static figures of respiratory-virus air-sampling detections, 2026 FIFA World Cup (Team Canada)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "kaleido>=0.2.1",
    "numpy>=1.24",
]

[project.scripts]
make-figures = "make_figures_1_2_detections:main"

[tool.uv]
package = false
