project:
  type: default
  output-dir: _site
  render:
    - index.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-location: left
    toc-depth: 2
    page-layout: full
    embed-resources: false
    css: styles.css
    grid:
      body-width: 900px
    link-external-newwindow: true
  pdf:
    documentclass: article
    geometry:
      - margin=1in
    fontsize: 11pt
    colorlinks: true
    keep-tex: false
    # Each figure on its own page.
    fig-pos: 'p'
    include-in-header:
      text: |
        % Page break before every major section. Quarto maps ## headings to
        % \subsection in this class, so hook \subsection (not \section).
        \usepackage{etoolbox}
        \pretocmd{\subsection}{\clearpage}{}{}
        % Bold the figure label ("Figure 3") in captions; titles are already bold.
        \usepackage{caption}
        \captionsetup{labelfont=bf}
        % Allow a full page of floats so a figure can sit alone on its page.
        \renewcommand{\floatpagefraction}{0.01}
        \renewcommand{\topfraction}{0.99}
        \renewcommand{\bottomfraction}{0.99}
        \renewcommand{\textfraction}{0.01}
