project:
  type: default
  output-dir: _site
  render:
    - index.qmd

# Title + subtitle come from the Google Doc, written to _title.yml by
# scripts/fetch_prose.py. Kept out of index.qmd so nothing about the title is
# hard-coded — edit the Doc.
metadata-files:
  - _title.yml

# Colours the unnumbered figure labels (Central Figure, online supplemental
# figure) in the PDF; HTML handles them via the .fig-number class directly.
filters:
  - fig-number.lua

format:
  html:
    # House style: cream canvas, deep-teal ink, terracotta accent, Georgia +
    # Arial. theme-house.scss carries the full brand system.
    theme: theme-house.scss
    toc: true
    toc-location: left
    toc-depth: 2
    page-layout: article
    embed-resources: false
    css: styles.css
    # Wraps the bare "Figure N:" text node in each caption so the house accent
    # can be applied to it (CSS cannot target a bare text node), and opens every
    # outbound link in a new tab.
    include-after-body: site-enhance.html
    grid:
      body-width: 820px
      margin-width: 260px
    link-external-newwindow: true
  # Two PDFs are built from this one format:
  #
  #   quarto render index.qmd --to pdf
  #       -> the JOURNAL (Eurosurveillance) submission. No preprint pointer.
  #   quarto render index.qmd --to pdf -M preprint:true
  #       -> the medRxiv/preprint version, identical except that it carries the
  #          Doc's "Preprint only" note under the title.
  #
  # index.qmd shows that note only when the `preprint` metadata flag is set, so
  # the two builds share every layout setting and cannot drift apart. CI builds
  # both; see .github/workflows/render.yml.
  pdf:
    # Submission PDF: WHITE background (journal requirement) with house-style
    # font + layout (house-preamble.tex), rendered with tectonic so the system
    # Georgia/Arial fonts resolve through fontspec/XeLaTeX.
    documentclass: article
    pdf-engine: tectonic
    geometry:
      - margin=1in
    fontsize: 11pt
    linestretch: 1.12
    colorlinks: true
    keep-tex: false
    # Figures are placed exactly where written (each is wrapped in explicit page
    # breaks in index.qmd), so keep them in-flow rather than floating.
    fig-pos: 'H'
    include-in-header:
      # First the house look (fonts, teal headings, terracotta links, white bg,
      # and the caption styling, which sets labelfont=bf itself)…
      - file: house-preamble.tex
      # …then the layout hooks carried over from the tracked build.
      - text: |
          % Page break before every major section. Quarto maps ## headings to
          % \subsection in this class, so hook \subsection (not \section).
          \usepackage{etoolbox}
          \pretocmd{\subsection}{\clearpage}{}{}
          % Honour [H] "here, definitely" float placement.
          \usepackage{float}
